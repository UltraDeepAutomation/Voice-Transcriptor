name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm install` (not `npm ci`): the committed frontend/package-lock.json is
      # currently out of sync with package.json (missing some platform-optional
      # transitive deps), which makes `npm ci` fail. `npm install` is resilient to
      # that. Switch to `npm ci` once the lockfile is regenerated.
      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Typecheck
        run: npm --prefix frontend run typecheck

  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      # Node is required: several backend tests (mic-health, live-coverage)
      # compile and execute the frontend TypeScript via `node`/`tsc` to verify
      # the JS/TS contract stays in sync with the Python backend. Without Node +
      # frontend/node_modules those tests self-skip, so we provide both.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies (for TS cross-tests)
        run: npm --prefix frontend install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest backend/tests -q
